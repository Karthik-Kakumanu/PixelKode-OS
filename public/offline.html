<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelkode Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(244, 114, 182, 0.18), transparent 30%),
          radial-gradient(circle at top right, rgba(56, 189, 248, 0.18), transparent 28%),
          linear-gradient(180deg, #f8fbff, #eef4fb);
        color: #0f172a;
      }

      .card {
        width: min(92vw, 460px);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      .badge {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #ec4899, #8b5cf6, #38bdf8);
        color: white;
        font-weight: 700;
        font-size: 20px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">P</div>
      <h1>Pixelkode is offline</h1>
      <p>Your last opened pages and sheet data stay available once the app has been loaded online at least once.</p>
    </main>
  </body>
</html>
